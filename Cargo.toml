[package]
name = "standalone-tray"
version = "0.1.0"
edition = "2021"
description = "A StatusNotifierHost that displays tray icons in a normal Wayland window"
license = "MIT"

[dependencies]
async-channel = "2"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
gtk = { package = "gtk4", version = "0.10" }
system-tray = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
strip = true
